<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>keyring gi do</title>
<meta name="theme-color" content="#ffffff">
<script>
(function () {
  var VI = {
    'keyring studio 3d': 'keyring studio 3d', 'keyring studio': 'xưởng móc khóa',
    '3d keyring viewport': 'khung xem móc khóa 3d', 'charms': 'charm', 'artwork': 'hình ảnh', 'border': 'viền',
    'keyring': 'móc khóa', 'project': 'dự án', 'control tabs': 'các tab điều khiển', 'keyring controls': 'điều khiển móc khóa',
    'charms (max 3)': 'charm (tối đa 3)', 'selected charm': 'charm đang chọn', 'move up': 'đưa lên', 'move down': 'đưa xuống',
    'duplicate': 'nhân bản', 'delete': 'xóa', 'size': 'kích thước', 'spin': 'xoay ngang',
    'upload png / jpg / webp': 'tải ảnh png / jpg / webp', 'scale': 'tỉ lệ', 'rotate': 'xoay', 'offset x': 'lệch x', 'offset y': 'lệch y',
    'acrylic border': 'viền acrylic', 'enable border': 'bật viền', 'tint': 'màu viền', 'thickness': 'độ dày', 'opacity': 'độ mờ đục', 'glossiness': 'độ bóng',
    'scene and project': 'cảnh và dự án', 'reset camera': 'đặt lại camera', 'export png': 'xuất png',
    'drag charm, ring or loop': 'kéo charm, vòng hoặc khuyên', 'swing or move the keyring': 'đung đưa hoặc di chuyển móc khóa',
    'drag background': 'kéo nền', 'orbit camera': 'xoay camera', 'right-drag / shift-drag': 'kéo chuột phải / shift', 'pan': 'dịch chuyển',
    'scroll / pinch': 'cuộn / chụm', 'zoom': 'thu phóng', 'view mode': 'chế độ xem', 'hide all controls': 'ẩn toàn bộ điều khiển', 'language': 'ngôn ngữ',
    'switch to dark mode': 'chuyển sang chế độ tối', 'switch to light mode': 'chuyển sang chế độ sáng',
    'tap anywhere to bring the controls back': 'chạm vào bất kỳ đâu để hiện lại điều khiển',
    'unsupported file type. use png, jpg or webp.': 'loại tệp không được hỗ trợ. hãy dùng png, jpg hoặc webp.',
    'could not read that image.': 'không đọc được ảnh này.',
    'fallback: 2d canvas mode, not real 3d (no orbit or 3d materials)': 'chế độ dự phòng: canvas 2d, không phải 3d thật (không xoay camera, không có vật liệu 3d)',
    'a rendering error occurred. check the console for details.': 'đã xảy ra lỗi hiển thị. xem chi tiết trong console.',
    'charm {n}': 'charm {n}'
  };
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (_) {} return null; }
  var lang = ls('card-lang') === 'vi' ? 'vi' : 'en';
  var theme = ls('card-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  var root = document.documentElement; root.dataset.theme = theme; root.lang = lang;
  function t(s, p) { var o = (lang === 'vi' && VI[s]) || s; if (p) for (var k in p) o = o.split('{' + k + '}').join(p[k]); return o; }
  function walk() {
    var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null), n;
    while ((n = w.nextNode())) {
      if (!n.parentElement || n.parentElement.closest('[data-nt],script,style')) continue;
      if (n.__o === undefined) { var k = n.nodeValue.trim(); if (!VI[k]) continue; n.__o = n.nodeValue; n.__k = k; }
      n.nodeValue = lang === 'vi' ? n.__o.replace(n.__k, VI[n.__k]) : n.__o;
    }
    document.querySelectorAll('[aria-label],[title],[alt]').forEach(function (el) {
      if (el.closest('[data-nt]')) return;
      ['aria-label', 'title', 'alt'].forEach(function (a) {
        var v = el.getAttribute(a); if (v === null) return;
        var o = el['__o_' + a]; if (o === undefined) { if (!VI[v]) return; o = el['__o_' + a] = v; }
        el.setAttribute(a, lang === 'vi' ? VI[o] || o : o);
      });
    });
    document.title = t('keyring studio 3d');
  }
  function fire(n, d) { window.dispatchEvent(new CustomEvent(n, { detail: d })); }
  function sync() {
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
    var tb = document.getElementById('themeBtn');
    if (tb) { var m = t(theme === 'dark' ? 'switch to light mode' : 'switch to dark mode'); tb.setAttribute('aria-label', m); tb.title = m; }
    var mc = document.querySelector('meta[name=theme-color]'); if (mc) mc.content = theme === 'dark' ? '#0b0b0f' : '#ffffff';
  }
  window.CardUI = { t: t, theme: function () { return theme; } };
  document.addEventListener('DOMContentLoaded', function () {
    walk(); sync();
    document.querySelectorAll('[data-lang]').forEach(function (b) {
      b.addEventListener('click', function () { lang = b.dataset.lang; ls('card-lang', lang); root.lang = lang; walk(); sync(); fire('card:lang', lang); });
    });
    document.getElementById('themeBtn').addEventListener('click', function () {
      theme = theme === 'dark' ? 'light' : 'dark'; ls('card-theme', theme); root.dataset.theme = theme; sync(); fire('card:theme', theme);
    });
    document.querySelector('.top-right').addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  });
})();
</script>

<style>
  :root {
    --ink: #16161a;
    --muted: #6c6c75;
    --line: #e5e5e8;
    --line-2: #cfcfd5;
    --panel: rgba(255, 255, 255, .94);
    --danger: #b42318;
    --ok: #067647;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button, input { font-family: inherit; }

  #app {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    height: 100vh;
    height: 100dvh;
  }
  #viewport {
    position: relative;
    min-height: 0;
    overflow: hidden;
    background-color: #fff;
    background-image: radial-gradient(#d8d8e0 1px, transparent 1px);
    background-size: 24px 24px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #viewport > canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
    opacity: 0;
    transition: opacity .9s ease;
    z-index: 0;
    touch-action: none;
  }
  #viewport.ready > canvas { opacity: 1; }
  body.dragging, body.dragging * { cursor: grabbing !important; }

  .brand {
    position: absolute; left: 18px; top: 14px; z-index: 5;
    font-size: 12px; font-weight: 600; letter-spacing: .06em;
    color: var(--muted); pointer-events: none;
  }
  .charm-picker {
    position: absolute; left: 18px; top: 44px; z-index: 6;
    display: flex; gap: 6px;
  }
  .charm-picker button {
    width: 34px; height: 34px; padding: 0;
    border-radius: 999px;
    border: 1px solid var(--line-2);
    background: var(--panel);
    color: var(--muted);
    font-size: 13px; font-weight: 700;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .charm-picker button:hover:not(:disabled) { background: #f5f5f7; border-color: #b9b9c1; }
  .charm-picker button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .charm-picker button:disabled { opacity: .3; cursor: not-allowed; }

  .angle-pill {
    position: absolute; right: 16px; top: 10px; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); font-size: 12px; color: var(--muted);
    pointer-events: none; font-variant-numeric: tabular-nums;
  }
  .angle-pill b { color: var(--ink); font-weight: 650; min-width: 3ch; text-align: right; }
  .hint {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px;
    font-size: 12px; color: var(--muted); pointer-events: none; text-align: center; width: max-content; max-width: 94%;
  }
  .hint b { color: var(--ink); font-weight: 600; margin-right: 4px; }

  #toast {
    position: absolute; left: 50%; bottom: 46px; transform: translate(-50%, 8px); z-index: 6;
    padding: 9px 16px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; max-width: 90%; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #controls {
    display: flex; flex-direction: column; align-items: stretch; gap: 12px;
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: #fff;
    max-height: 44dvh; overflow: auto;
  }
  .tabs { align-self: center; flex: none; max-width: 100%; overflow-x: auto; }
  .tabs button { white-space: nowrap; }
  .pane { display: none; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 14px 28px; }
  .pane.on { display: flex; animation: fade .3s ease; }
  .group { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 0 1 250px; }
  .group.wide { flex: 1 1 440px; max-width: 560px; }
  .group-title { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row > .btn { flex: 1 1 auto; }
  .sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
  .group:not(.wide) .sgrid { grid-template-columns: 1fr; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 38px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line-2);
    background: #fff; color: var(--ink); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover:not(:disabled) { background: #f5f5f7; border-color: #b9b9c1; }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #2b2b31; border-color: #2b2b31; }
  .btn[aria-pressed="true"].toggle { background: #f0f0f3; border-color: #a9a9b3; }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn.small { min-height: 30px; padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  .btn.icon { min-height: 32px; width: 34px; padding: 0; border-radius: 999px; }
  button:focus-visible, input:focus-visible { outline: 2px solid #4b6bfb; outline-offset: 2px; }

  .slot { padding: 4px 12px 4px 4px; }
  .slot canvas { width: 30px; height: 30px; border-radius: 8px; background: rgba(136, 146, 166, .25); display: block; }
  .slot[aria-pressed="true"] { background: #f0f0f3; border-color: #a9a9b3; }

  .slider { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .slider .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .slider output { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; height: 26px; margin: 0; accent-color: var(--ink); cursor: pointer; background: transparent; }
  input[type="color"] { width: 100%; height: 34px; border: 1px solid var(--line-2); border-radius: 10px; background: #fff; padding: 3px; cursor: pointer; transition: border-color .15s ease; }
  input[type="color"]:hover { border-color: #b9b9c1; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }

  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 7px 12px; font-size: 13px; cursor: pointer; color: var(--ink); transition: background-color .15s ease, color .15s ease; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .credit {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 4px 16px; padding-top: 8px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
  }
  .credit .handle { font-weight: 650; color: var(--ink); letter-spacing: .01em; }
  .credit a {
    color: var(--muted); text-decoration: none; padding-bottom: 1px;
    border-bottom: 1px solid var(--line-2);
    transition: color .15s ease, border-color .15s ease;
  }
  .credit a:hover { color: var(--ink); border-bottom-color: var(--ink); }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .top-right { position: absolute; right: 12px; top: 8px; z-index: 12; display: flex; align-items: center; gap: 8px; }
  .top-right .angle-pill { position: static; }
  .top-right .seg button { padding: 5px 9px; font-size: 12px; font-weight: 600; }
  .ico-sun { display: none; }
  [data-theme="dark"] .ico-sun { display: block; }
  [data-theme="dark"] .ico-moon { display: none; }
  html, body, #viewport, #controls { transition: background-color .3s ease; }

  body.view-mode #controls, body.view-mode .top-right, body.view-mode .brand, body.view-mode .hint, body.view-mode .charm-picker { display: none !important; }
  #controls, .top-right, .brand, .hint, .charm-picker { animation: fade .3s ease; }

  @media (max-width: 720px) {
    #controls { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); max-height: 46dvh; }
    .group, .group.wide { flex: 1 1 100%; max-width: none; }
    .hint { display: none; }
    .brand { left: 14px; top: 12px; font-size: 11px; max-width: 46%; }
    .charm-picker { left: 14px; top: 38px; }
    .charm-picker button { width: 32px; height: 32px; font-size: 12px; }
    .angle-pill { right: 12px; top: 8px; }
    .top-right .angle-pill > span { display: none; }
    .btn { min-height: 42px; }
    #toast { bottom: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  :root[data-theme="dark"] { color-scheme: dark; --ink: #ececf1; --muted: #9a9aa6; --line: #2a2a33; --line-2: #3b3b47; --panel: rgba(22,22,28,.9); --danger: #ff8a80; --ok: #5fd19a; }
  :root[data-theme="dark"], [data-theme="dark"] body, [data-theme="dark"] #controls { background: #0b0b0f; }
  [data-theme="dark"] #viewport {
    background-color: #0b0b0f;
    background-image: radial-gradient(#23232c 1px, transparent 1px);
    background-size: 24px 24px;
  }
  [data-theme="dark"] .btn, [data-theme="dark"] .seg button, [data-theme="dark"] input[type="color"] { background: #15151b; }
  [data-theme="dark"] .btn:hover:not(:disabled) { background: #1e1e26; border-color: #4a4a58; }
  [data-theme="dark"] .btn[aria-pressed="true"].toggle, [data-theme="dark"] .slot[aria-pressed="true"] { background: #23232c; border-color: #4a4a58; }
  [data-theme="dark"] .btn.primary { background: #ececf1; border-color: #ececf1; color: #0b0b0f; }
  [data-theme="dark"] .btn.primary:hover:not(:disabled) { background: #d4d4dc; border-color: #d4d4dc; }
  [data-theme="dark"] .seg button[aria-pressed="true"] { background: #ececf1; color: #0b0b0f; }
  [data-theme="dark"] #toast { background: #ececf1; color: #0b0b0f; }
  [data-theme="dark"] .charm-picker button { background: #15151b; }
  [data-theme="dark"] .charm-picker button:hover:not(:disabled) { background: #1e1e26; border-color: #4a4a58; }
  [data-theme="dark"] .charm-picker button[aria-pressed="true"] { background: #ececf1; border-color: #ececf1; color: #0b0b0f; }
</style>
</head>
<body>
<div id="app">
  <main id="viewport" aria-label="3d keyring viewport">
    <div class="brand">keyring studio</div>
    <div class="charm-picker" id="charmPicker" role="group" aria-label="charms"></div>
    <div class="top-right">
      <div class="angle-pill"><span>charms</span><b id="pillN">0/3</b></div>
      <div class="seg" role="group" aria-label="language"><button type="button" data-lang="en" aria-pressed="true">en</button><button type="button" data-lang="vi" aria-pressed="false">vi</button></div>
      <button id="viewBtn" class="btn icon" type="button" aria-label="view mode" title="hide all controls">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button id="themeBtn" class="btn icon" type="button" data-nt aria-label="switch to dark mode">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.7 6.7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="hint" id="hint">
      <span><b>drag charm, ring or loop</b>swing or move the keyring</span>
      <span><b>drag background</b>orbit camera</span>
      <span><b>right-drag / shift-drag</b>pan</span>
      <span><b>scroll / pinch</b>zoom</span>
    </div>
    <div id="toast" data-nt role="status" aria-live="polite"></div>
  </main>

  <section id="controls" aria-label="keyring controls">
    <div class="seg tabs" role="group" aria-label="control tabs">
      <button type="button" data-tab="charms" aria-pressed="true">charms</button>
      <button type="button" data-tab="art" aria-pressed="false">artwork</button>
      <button type="button" data-tab="border" aria-pressed="false">border</button>
      <button type="button" data-tab="project" aria-pressed="false">project</button>
    </div>

    <div class="pane on" id="t_charms">
      <div class="group" style="flex-basis:360px">
        <div class="group-title">charms (max 3)</div>
        <div class="row" id="slots" data-nt></div>
        <div class="row">
          <button class="btn small" id="up" type="button">move up</button>
          <button class="btn small" id="dn" type="button">move down</button>
          <button class="btn small" id="dup" type="button">duplicate</button>
          <button class="btn small" id="del" type="button">delete</button>
        </div>
      </div>
      <div class="group">
        <div class="group-title">selected charm</div>
        <div class="sgrid" id="g_c"></div>
      </div>
    </div>

    <div class="pane" id="t_art">
      <div class="group wide">
        <div class="group-title">artwork</div>
        <div class="row">
          <button id="uploadBtn" class="btn primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m8 8 3-3 3 3M11 5v9"/></svg>
            upload png / jpg / webp
          </button>
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        </div>
        <div class="sgrid" id="g_art"></div>
      </div>
    </div>

    <div class="pane" id="t_border">
      <div class="group wide">
        <div class="group-title">border</div>
        <div class="row">
          <button id="bd" class="btn toggle" type="button" aria-pressed="false">enable border</button>
          <label class="field" style="flex:0 0 120px"><span>tint</span><input id="tint" type="color"></label>
        </div>
        <div class="sgrid" id="g_bd"></div>
      </div>
    </div>

    <div class="pane" id="t_project">
      <div class="group wide">
        <div class="group-title">scene and project</div>
        <div class="row">
          <button id="cam" class="btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            reset camera
          </button>
          <button id="png" class="btn" type="button">export png</button>
        </div>
      </div>
    </div>

    <div class="credit" data-nt>
      <span class="handle">@whoisdminhh</span>
      <a href="https://www.facebook.com/whoisdminhh/" target="_blank" rel="noopener noreferrer">ủng hộ tui ở fb</a>
      <a href="https://www.instagram.com/whoisdminhh/" target="_blank" rel="noopener noreferrer">ủng hộ tui ở ig</a>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{

function mv(d){const i=charms.indexOf(sel),j=i+d;if(i<0||j<0||j>=charms.length)return;[charms[i],charms[j]]=[charms[j],charms[i]];reset();slots()}
$('up').onclick=()=>mv(-1);$('dn').onclick=()=>mv(1);
$('uploadBtn').onclick=()=>$('file').click();
$('viewBtn').onclick=()=>setView(true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&inView())setView(false)});
window.addEventListener('card:lang',()=>{slots()});
$('file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type))return toast('unsupported file type. use png, jpg or webp.');
const u=URL.createObjectURL(f),im=new Image();
im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=mk(Math.round(im.width*k),Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
if(charms.length<3){ add(c); }
else if(sel){ sel.src=c;sel.sw=c.width;sel.sh=c.height;Object.assign(sel,{scale:1,rot:0,ox:0,oy:0});sel.dirty=1;ui(); }
};
im.onerror=()=>toast('could not read that image.');im.src=u};
$('png').onclick=()=>{if(three&&r){sync3();r.render(scene,cam)}else d2();dl('keyring.png',cv.toDataURL('image/png'))};

/* ---------- boot ---------- */
if(three)init3();
if(!three){cv=mk(10,10);x2=cv.getContext('2d')}
cv.style.display='block';stage.insertBefore(cv,stage.firstChild);bind();
if(!three)toast('fallback: 2d canvas mode, not real 3d (no orbit or 3d materials)',6000);
new ResizeObserver(rs).observe(stage);rs();
ui();
reset();
let last=performance.now(),acc=0,errd=false;
function loop(t){requestAnimationFrame(loop);try{const dt=Math.min((t-last)/1000,.05);last=t;
acc+=dt;let n=0;while(acc>=1/60&&n++<4){step(1/60);acc-=1/60}
let ch=0;charms.forEach(c=>{if(c.dirty&&t-(c.lt||0)>70){build(c);c.dirty=0;c.lt=t;ch=1}});if(ch)slots();
charms.forEach(c=>c.th=Math.atan2(c.T.y-c.B.y,c.T.x-c.B.x)-Math.PI/2);
if(three&&r){updCam();sync3();r.render(scene,cam)}else d2();
if(!stage.classList.contains('ready'))stage.classList.add('ready')}
catch(err){if(!errd){errd=true;console.error(err);toast('a rendering error occurred. check the console for details.',5000)}}}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
