<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>keyring studio 3d</title>
<meta name="theme-color" content="#ffffff">
<script>
(function () {
  var VI = {
    'keyring studio 3d': 'keyring studio 3d', 'keyring studio': 'xưởng móc khóa',
    '3d keyring viewport': 'khung xem móc khóa 3d', 'charms': 'charm', 'artwork': 'hình ảnh', 'border': 'viền',
    'keyring': 'móc khóa', 'project': 'dự án', 'control tabs': 'các tab điều khiển', 'keyring controls': 'điều khiển móc khóa',
    'charms (max 3)': 'charm (tối đa 3)', 'selected charm': 'charm đang chọn', 'move up': 'đưa lên', 'move down': 'đưa xuống',
    'duplicate': 'nhân bản', 'delete': 'xóa', 'size': 'kích thước', 'spin': 'xoay ngang',
    'upload png / jpg / webp': 'tải ảnh png / jpg / webp', 'scale': 'tỉ lệ', 'rotate': 'xoay', 'offset x': 'lệch x', 'offset y': 'lệch y',
    'acrylic border': 'viền acrylic', 'enable border': 'bật viền', 'tint': 'màu viền', 'thickness': 'độ dày', 'opacity': 'độ mờ đục', 'glossiness': 'độ bóng',
    'scene and project': 'cảnh và dự án', 'reset camera': 'đặt lại camera', 'export png': 'xuất png',
    'drag charm, ring or loop': 'kéo charm, vòng hoặc khuyên', 'swing or move the keyring': 'đung đưa hoặc di chuyển móc khóa',
    'drag background': 'kéo nền', 'orbit camera': 'xoay camera', 'right-drag / shift-drag': 'kéo chuột phải / shift', 'pan': 'dịch chuyển',
    'scroll / pinch': 'cuộn / chụm', 'zoom': 'thu phóng', 'view mode': 'chế độ xem', 'hide all controls': 'ẩn toàn bộ điều khiển', 'language': 'ngôn ngữ',
    'switch to dark mode': 'chuyển sang chế độ tối', 'switch to light mode': 'chuyển sang chế độ sáng',
    'tap anywhere to bring the controls back': 'chạm vào bất kỳ đâu để hiện lại điều khiển',
    'unsupported file type. use png, jpg or webp.': 'loại tệp không được hỗ trợ. hãy dùng png, jpg hoặc webp.',
    'could not read that image.': 'không đọc được ảnh này.',
    'fallback: 2d canvas mode, not real 3d (no orbit or 3d materials)': 'chế độ dự phòng: canvas 2d, không phải 3d thật (không xoay camera, không có vật liệu 3d)',
    'a rendering error occurred. check the console for details.': 'đã xảy ra lỗi hiển thị. xem chi tiết trong console.',
    'charm {n}': 'charm {n}'
  };
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (_) {} return null; }
  var lang = ls('card-lang') === 'vi' ? 'vi' : 'en';
  var theme = ls('card-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  var root = document.documentElement; root.dataset.theme = theme; root.lang = lang;
  function t(s, p) { var o = (lang === 'vi' && VI[s]) || s; if (p) for (var k in p) o = o.split('{' + k + '}').join(p[k]); return o; }
  function walk() {
    var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null), n;
    while ((n = w.nextNode())) {
      if (!n.parentElement || n.parentElement.closest('[data-nt],script,style')) continue;
      if (n.__o === undefined) { var k = n.nodeValue.trim(); if (!VI[k]) continue; n.__o = n.nodeValue; n.__k = k; }
      n.nodeValue = lang === 'vi' ? n.__o.replace(n.__k, VI[n.__k]) : n.__o;
    }
    document.querySelectorAll('[aria-label],[title],[alt]').forEach(function (el) {
      if (el.closest('[data-nt]')) return;
      ['aria-label', 'title', 'alt'].forEach(function (a) {
        var v = el.getAttribute(a); if (v === null) return;
        var o = el['__o_' + a]; if (o === undefined) { if (!VI[v]) return; o = el['__o_' + a] = v; }
        el.setAttribute(a, lang === 'vi' ? VI[o] || o : o);
      });
    });
    document.title = t('keyring studio 3d');
  }
  function fire(n, d) { window.dispatchEvent(new CustomEvent(n, { detail: d })); }
  function sync() {
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
    var tb = document.getElementById('themeBtn');
    if (tb) { var m = t(theme === 'dark' ? 'switch to light mode' : 'switch to dark mode'); tb.setAttribute('aria-label', m); tb.title = m; }
    var mc = document.querySelector('meta[name=theme-color]'); if (mc) mc.content = theme === 'dark' ? '#0b0b0f' : '#ffffff';
  }
  window.CardUI = { t: t, theme: function () { return theme; } };
  document.addEventListener('DOMContentLoaded', function () {
    walk(); sync();
    document.querySelectorAll('[data-lang]').forEach(function (b) {
      b.addEventListener('click', function () { lang = b.dataset.lang; ls('card-lang', lang); root.lang = lang; walk(); sync(); fire('card:lang', lang); });
    });
    document.getElementById('themeBtn').addEventListener('click', function () {
      theme = theme === 'dark' ? 'light' : 'dark'; ls('card-theme', theme); root.dataset.theme = theme; sync(); fire('card:theme', theme);
    });
    document.querySelector('.top-right').addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  });
})();
</script>

<style>
  :root {
    --ink: #16161a;
    --muted: #6c6c75;
    --line: #e5e5e8;
    --line-2: #cfcfd5;
    --panel: rgba(255, 255, 255, .94);
    --danger: #b42318;
    --ok: #067647;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button, input { font-family: inherit; }

  #app {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    height: 100vh;
    height: 100dvh;
  }
  #viewport {
    position: relative;
    min-height: 0;
    overflow: hidden;
    background-color: #fff;
    background-image: radial-gradient(#d8d8e0 1px, transparent 1px);
    background-size: 24px 24px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #viewport > canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
    opacity: 0;
    transition: opacity .9s ease;
    z-index: 0;
    touch-action: none;
  }
  #viewport.ready > canvas { opacity: 1; }
  body.dragging, body.dragging * { cursor: grabbing !important; }

  .brand {
    position: absolute; left: 18px; top: 14px; z-index: 5;
    font-size: 12px; font-weight: 600; letter-spacing: .06em;
    color: var(--muted); pointer-events: none;
  }
  .charm-picker {
    position: absolute; left: 18px; top: 44px; z-index: 6;
    display: flex; gap: 6px;
  }
  .charm-picker button {
    width: 34px; height: 34px; padding: 0;
    border-radius: 999px;
    border: 1px solid var(--line-2);
    background: var(--panel);
    color: var(--muted);
    font-size: 13px; font-weight: 700;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .charm-picker button:hover:not(:disabled) { background: #f5f5f7; border-color: #b9b9c1; }
  .charm-picker button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .charm-picker button:disabled { opacity: .3; cursor: not-allowed; }

  .angle-pill {
    position: absolute; right: 16px; top: 10px; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); font-size: 12px; color: var(--muted);
    pointer-events: none; font-variant-numeric: tabular-nums;
  }
  .angle-pill b { color: var(--ink); font-weight: 650; min-width: 3ch; text-align: right; }
  .hint {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px;
    font-size: 12px; color: var(--muted); pointer-events: none; text-align: center; width: max-content; max-width: 94%;
  }
  .hint b { color: var(--ink); font-weight: 600; margin-right: 4px; }

  #toast {
    position: absolute; left: 50%; bottom: 46px; transform: translate(-50%, 8px); z-index: 6;
    padding: 9px 16px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; max-width: 90%; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #controls {
    display: flex; flex-direction: column; align-items: stretch; gap: 12px;
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: #fff;
    max-height: 44dvh; overflow: auto;
  }
  .tabs { align-self: center; flex: none; max-width: 100%; overflow-x: auto; }
  .tabs button { white-space: nowrap; }
  .pane { display: none; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 14px 28px; }
  .pane.on { display: flex; animation: fade .3s ease; }
  .group { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 0 1 250px; }
  .group.wide { flex: 1 1 440px; max-width: 560px; }
  .group-title { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row > .btn { flex: 1 1 auto; }
  .sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
  .group:not(.wide) .sgrid { grid-template-columns: 1fr; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 38px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line-2);
    background: #fff; color: var(--ink); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover:not(:disabled) { background: #f5f5f7; border-color: #b9b9c1; }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #2b2b31; border-color: #2b2b31; }
  .btn[aria-pressed="true"].toggle { background: #f0f0f3; border-color: #a9a9b3; }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn.small { min-height: 30px; padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  .btn.icon { min-height: 32px; width: 34px; padding: 0; border-radius: 999px; }
  button:focus-visible, input:focus-visible { outline: 2px solid #4b6bfb; outline-offset: 2px; }

  .slot { padding: 4px 12px 4px 4px; }
  .slot canvas { width: 30px; height: 30px; border-radius: 8px; background: rgba(136, 146, 166, .25); display: block; }
  .slot[aria-pressed="true"] { background: #f0f0f3; border-color: #a9a9b3; }

  .slider { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .slider .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .slider output { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; height: 26px; margin: 0; accent-color: var(--ink); cursor: pointer; background: transparent; }
  input[type="color"] { width: 100%; height: 34px; border: 1px solid var(--line-2); border-radius: 10px; background: #fff; padding: 3px; cursor: pointer; transition: border-color .15s ease; }
  input[type="color"]:hover { border-color: #b9b9c1; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }

  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 7px 12px; font-size: 13px; cursor: pointer; color: var(--ink); transition: background-color .15s ease, color .15s ease; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .credit {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 4px 16px; padding-top: 8px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
  }
  .credit .handle { font-weight: 650; color: var(--ink); letter-spacing: .01em; }
  .credit a {
    color: var(--muted); text-decoration: none; padding-bottom: 1px;
    border-bottom: 1px solid var(--line-2);
    transition: color .15s ease, border-color .15s ease;
  }
  .credit a:hover { color: var(--ink); border-bottom-color: var(--ink); }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .top-right { position: absolute; right: 12px; top: 8px; z-index: 12; display: flex; align-items: center; gap: 8px; }
  .top-right .angle-pill { position: static; }
  .top-right .seg button { padding: 5px 9px; font-size: 12px; font-weight: 600; }
  .ico-sun { display: none; }
  [data-theme="dark"] .ico-sun { display: block; }
  [data-theme="dark"] .ico-moon { display: none; }
  html, body, #viewport, #controls { transition: background-color .3s ease; }

  body.view-mode #controls, body.view-mode .top-right, body.view-mode .brand, body.view-mode .hint, body.view-mode .charm-picker { display: none !important; }
  #controls, .top-right, .brand, .hint, .charm-picker { animation: fade .3s ease; }

  @media (max-width: 720px) {
    #controls { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); max-height: 46dvh; }
    .group, .group.wide { flex: 1 1 100%; max-width: none; }
    .hint { display: none; }
    .brand { left: 14px; top: 12px; font-size: 11px; max-width: 46%; }
    .charm-picker { left: 14px; top: 38px; }
    .charm-picker button { width: 32px; height: 32px; font-size: 12px; }
    .angle-pill { right: 12px; top: 8px; }
    .top-right .angle-pill > span { display: none; }
    .btn { min-height: 42px; }
    #toast { bottom: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  :root[data-theme="dark"] { color-scheme: dark; --ink: #ececf1; --muted: #9a9aa6; --line: #2a2a33; --line-2: #3b3b47; --panel: rgba(22,22,28,.9); --danger: #ff8a80; --ok: #5fd19a; }
  :root[data-theme="dark"], [data-theme="dark"] body, [data-theme="dark"] #controls { background: #0b0b0f; }
  [data-theme="dark"] #viewport {
    background-color: #0b0b0f;
    background-image: radial-gradient(#23232c 1px, transparent 1px);
    background-size: 24px 24px;
  }
  [data-theme="dark"] .btn, [data-theme="dark"] .seg button, [data-theme="dark"] input[type="color"] { background: #15151b; }
  [data-theme="dark"] .btn:hover:not(:disabled) { background: #1e1e26; border-color: #4a4a58; }
  [data-theme="dark"] .btn[aria-pressed="true"].toggle, [data-theme="dark"] .slot[aria-pressed="true"] { background: #23232c; border-color: #4a4a58; }
  [data-theme="dark"] .btn.primary { background: #ececf1; border-color: #ececf1; color: #0b0b0f; }
  [data-theme="dark"] .btn.primary:hover:not(:disabled) { background: #d4d4dc; border-color: #d4d4dc; }
  [data-theme="dark"] .seg button[aria-pressed="true"] { background: #ececf1; color: #0b0b0f; }
  [data-theme="dark"] #toast { background: #ececf1; color: #0b0b0f; }
  [data-theme="dark"] .charm-picker button { background: #15151b; }
  [data-theme="dark"] .charm-picker button:hover:not(:disabled) { background: #1e1e26; border-color: #4a4a58; }
  [data-theme="dark"] .charm-picker button[aria-pressed="true"] { background: #ececf1; border-color: #ececf1; color: #0b0b0f; }
</style>
</head>
<body>
<div id="app">
  <main id="viewport" aria-label="3d keyring viewport">
    <div class="brand">keyring studio</div>
    <div class="charm-picker" id="charmPicker" role="group" aria-label="charms"></div>
    <div class="top-right">
      <div class="angle-pill"><span>charms</span><b id="pillN">0/3</b></div>
      <div class="seg" role="group" aria-label="language"><button type="button" data-lang="en" aria-pressed="true">en</button><button type="button" data-lang="vi" aria-pressed="false">vi</button></div>
      <button id="viewBtn" class="btn icon" type="button" aria-label="view mode" title="hide all controls">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button id="themeBtn" class="btn icon" type="button" data-nt aria-label="switch to dark mode">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.7 6.7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="hint" id="hint">
      <span><b>drag charm, ring or loop</b>swing or move the keyring</span>
      <span><b>drag background</b>orbit camera</span>
      <span><b>right-drag / shift-drag</b>pan</span>
      <span><b>scroll / pinch</b>zoom</span>
    </div>
    <div id="toast" data-nt role="status" aria-live="polite"></div>
  </main>

  <section id="controls" aria-label="keyring controls">
    <div class="seg tabs" role="group" aria-label="control tabs">
      <button type="button" data-tab="charms" aria-pressed="true">charms</button>
      <button type="button" data-tab="art" aria-pressed="false">artwork</button>
      <button type="button" data-tab="border" aria-pressed="false">border</button>
      <button type="button" data-tab="project" aria-pressed="false">project</button>
    </div>

    <div class="pane on" id="t_charms">
      <div class="group" style="flex-basis:360px">
        <div class="group-title">charms (max 3)</div>
        <div class="row" id="slots" data-nt></div>
        <div class="row">
          <button class="btn small" id="up" type="button">move up</button>
          <button class="btn small" id="dn" type="button">move down</button>
          <button class="btn small" id="dup" type="button">duplicate</button>
          <button class="btn small" id="del" type="button">delete</button>
        </div>
      </div>
      <div class="group">
        <div class="group-title">selected charm</div>
        <div class="sgrid" id="g_c"></div>
      </div>
    </div>

    <div class="pane" id="t_art">
      <div class="group wide">
        <div class="group-title">artwork</div>
        <div class="row">
          <button id="uploadBtn" class="btn primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m8 8 3-3 3 3M11 5v9"/></svg>
            upload png / jpg / webp
          </button>
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        </div>
        <div class="sgrid" id="g_art"></div>
      </div>
    </div>

    <div class="pane" id="t_border">
      <div class="group wide">
        <div class="group-title">border</div>
        <div class="row">
          <button id="bd" class="btn toggle" type="button" aria-pressed="false">enable border</button>
          <label class="field" style="flex:0 0 120px"><span>tint</span><input id="tint" type="color"></label>
        </div>
        <div class="sgrid" id="g_bd"></div>
      </div>
    </div>

    <div class="pane" id="t_project">
      <div class="group wide">
        <div class="group-title">scene and project</div>
        <div class="row">
          <button id="cam" class="btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            reset camera
          </button>
          <button id="png" class="btn" type="button">export png</button>
        </div>
      </div>
    </div>

    <div class="credit" data-nt>
      <span class="handle">@whoisdminhh</span>
      <a href="https://www.facebook.com/whoisdminhh/" target="_blank" rel="noopener noreferrer">ủng hộ tui ở fb</a>
      <a href="https://www.instagram.com/whoisdminhh/" target="_blank" rel="noopener noreferrer">ủng hộ tui ở ig</a>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  var S=1024;
  var ART_BASE=360;
  var PLANE_MULT=1.78;
  var C_H_MULT=0.86;
  var RR=.45,CLN=5,CL=.14,TY=2.4;

  function dl(n,u){var a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();}

  function dilate(src,t,n){
    var c=mk(S,S),x=c.getContext('2d');
    x.drawImage(src,0,0);
    if(t<=0)return c;
    for(var i=0;i<n;i++){
      var a=i/n*6.283;
      x.drawImage(src,Math.cos(a)*t,Math.sin(a)*t);
      if(t>8)x.drawImage(src,Math.cos(a)*t*.5,Math.sin(a)*t*.5);
    }
    return c;
  }

  function buildSilhouette(c, ax, ay, rad, adw, adh, tabY){
    var s=mk(S,S),sx=s.getContext('2d');
    sx.save();
    sx.translate(ax,ay);
    sx.rotate(rad);
    sx.drawImage(c.src,0,0,c.sw,c.sh,-adw/2,-adh/2,adw,adh);
    sx.restore();
    sx.globalCompositeOperation='source-in';
    sx.fillStyle='#fff';
    sx.fillRect(0,0,S,S);
    sx.globalCompositeOperation='source-over';
    sx.save();
    sx.translate(ax, tabY);
    sx.fillStyle='#fff';
    sx.beginPath();
    sx.arc(0,0,44,0,7);
    sx.fill();
    sx.fillRect(-40,0,80,220);
    sx.restore();
    sx.globalCompositeOperation='destination-out';
    sx.save();
    sx.translate(ax, tabY);
    sx.beginPath();
    sx.arc(0,0,22,0,7);
    sx.fill();
    sx.restore();
    sx.globalCompositeOperation='source-over';
    return s;
  }

  function build(c){
    var a=c.ac.getContext('2d');
    a.clearRect(0,0,S,S);
    var w=c.sw,h=c.sh;
    var baseF=Math.min(ART_BASE/w, ART_BASE/h);
    var f=baseF*c.scale;
    var dw=w*f,dh=h*f;
    var rad=c.rot*Math.PI/180;
    var ca=Math.abs(Math.cos(rad)),sa=Math.abs(Math.sin(rad));
    var bw=dw*ca+dh*sa,bh=dw*sa+dh*ca;

    /* bounded offset so art never exceeds canvas */
    var maxOX=Math.max(40, Math.min(bw*.5, S/2 - bw/2 - 60));
    var maxOY=Math.max(40, Math.min(bh*.5, S/2 - bh/2 - 60));
    var ox=cl(c.ox,-maxOX,maxOX);
    var oy=cl(c.oy,-maxOY,maxOY);

    var ax=512+ox, ay=600+oy, tabY=104+oy;

    a.save();
    a.translate(ax,ay);
    a.rotate(rad);
    a.drawImage(c.src,0,0,w,h,-dw/2,-dh/2,dw,dh);
    a.restore();

    var sil=buildSilhouette(c,ax,ay,rad,dw,dh,tabY);
    a.globalCompositeOperation='destination-in';
    a.drawImage(sil,0,0);
    a.globalCompositeOperation='source-over';

    var t=c.border?c.thick*2:6;
    var m=dilate(sil,t,20);
    var m2=dilate(sil,Math.max(t-10,0),12);

    var b=c.bc.getContext('2d');
    b.clearRect(0,0,S,S);
    var q=m.getContext('2d');
    q.globalCompositeOperation='source-in';
    q.fillStyle=c.tint;
    q.fillRect(0,0,S,S);
    b.globalAlpha=c.alpha;
    b.drawImage(m,0,0);
    var e=mk(S,S),ex=e.getContext('2d');
    ex.drawImage(m,0,0);
    ex.globalCompositeOperation='destination-out';
    ex.drawImage(m2,0,0);
    ex.globalCompositeOperation='source-in';
    ex.fillStyle='#fff';
    ex.fillRect(0,0,S,S);
    b.globalAlpha=.55+.4*c.gloss;
    b.drawImage(e,0,0);
    b.globalAlpha=1;
    b.globalCompositeOperation='source-atop';
    var g=b.createLinearGradient(0,0,S,S);
    g.addColorStop(0,'rgba(255,255,255,'+(.4*c.gloss)+')');
    g.addColorStop(.45,'rgba(255,255,255,0)');
    g.addColorStop(1,'rgba(255,255,255,'+(.12*c.gloss)+')');
    b.fillStyle=g;
    b.fillRect(0,0,S,S);
    b.globalCompositeOperation='source-over';

    if(c.bt){c.bt.needsUpdate=true;c.at.needsUpdate=true;mat(c);}
  }

  function mat(c){
    if(!c.bm)return;
    c.bm.roughness=1-c.gloss*.95;
    c.bm.clearcoat=c.gloss;
    c.bm.clearcoatRoughness=.05;
    c.bm.emissive.setHex(c===sel?0x2c4f86:0);
    c.bm.emissiveIntensity=.35;
  }

  function mk3(c){
    c.bt=new THREE.CanvasTexture(c.bc);
    c.at=new THREE.CanvasTexture(c.ac);
    [c.bt,c.at].forEach(function(t){t.encoding=THREE.sRGBEncoding;t.anisotropy=4;});
    c.bm=new THREE.MeshPhysicalMaterial({map:c.bt,transparent:true,side:THREE.DoubleSide,depthWrite:false,metalness:0});
    c.am=new THREE.MeshStandardMaterial({map:c.at,transparent:true,roughness:.35,metalness:0,depthWrite:false});
    c.g=new THREE.Group();
    c.in=new THREE.Group();
    c.g.add(c.in);
    [-.02,.02].forEach(function(z){var m=new THREE.Mesh(PG,c.bm);m.position.z=z;c.in.add(m);});
    var f=new THREE.Mesh(PG,c.am);f.position.z=.032;c.in.add(f);
    var b=new THREE.Mesh(PG,c.am);b.position.z=-.032;b.rotation.y=Math.PI;c.in.add(b);
    c.j=new THREE.Group();
    c.jm=new THREE.Mesh(JG,silver);
    c.jm.rotation.y=Math.PI/3;
    c.j.add(c.jm);
    scene.add(c.g,c.j);
    mat(c);
  }

  function init3(){
    try{
      cv=mk(10,10);
      r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,powerPreference:'low-power'});
      r.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
      r.outputEncoding=THREE.sRGBEncoding;
      r.toneMapping=THREE.ACESFilmicToneMapping;
      r.toneMappingExposure=.95;
      r.setClearColor(0,0);
      scene=new THREE.Scene();
      cam=new THREE.PerspectiveCamera(35,1,.1,80);
      tgt=new THREE.Vector3(0,TY,0);
      rayc=new THREE.Raycaster();
      plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
      var ec=mk(512,256),ex=ec.getContext('2d'),gr=ex.createLinearGradient(0,0,0,256);
      gr.addColorStop(0,'#aab1bd');gr.addColorStop(.5,'#59606c');gr.addColorStop(1,'#1b1e24');
      ex.fillStyle=gr;ex.fillRect(0,0,512,256);
      ex.fillStyle='rgba(235,238,245,.85)';
      [[60,50,90,36],[250,30,120,28],[400,70,80,46],[150,130,60,18]].forEach(function(q){ex.fillRect(q[0],q[1],q[2],q[3]);});
      var et=new THREE.CanvasTexture(ec);
      et.mapping=THREE.EquirectangularReflectionMapping;
      scene.environment=new THREE.PMREMGenerator(r).fromEquirectangular(et).texture;
      scene.add(new THREE.HemisphereLight(0xffffff,0x8a93a6,.45));
      var d1=new THREE.DirectionalLight(0xffffff,.8);d1.position.set(3,5,6);scene.add(d1);
      var d2=new THREE.DirectionalLight(0xbfd2ff,.35);d2.position.set(-4,2,-4);scene.add(d2);
      silver=new THREE.MeshStandardMaterial({color:FIN[HW.fin],metalness:1,roughness:HW.rough});
      PG=new THREE.PlaneGeometry(1,1);
      JG=new THREE.TorusGeometry(.07,.018,10,24);
      LG=new THREE.TorusGeometry(.045,.013,8,20);
      ring=new THREE.Group();
      [-.02,.02].forEach(function(z){var m=new THREE.Mesh(new THREE.TorusGeometry(RR,.02,12,64),silver);m.position.z=z;ring.add(m);});
      scene.add(ring);
      for(var i=0;i<CLN;i++){
        var g=new THREE.Group(),m=new THREE.Mesh(LG,silver);
        m.scale.y=1.7;m.rotation.y=(i%2)*Math.PI/2;g.add(m);scene.add(g);chainG.push(g);
      }
      clasp=new THREE.Group();
      var pts=[];
      for(var j=0;j<40;j++){
        var tt=j/40*6.2832,c1=Math.cos(tt),s1=Math.sin(tt);
        pts.push(new THREE.Vector3(.17*Math.sign(c1)*Math.pow(Math.abs(c1),.66),.19+.19*Math.sign(s1)*Math.pow(Math.abs(s1),.66),0));
      }
      clasp.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true),64,.026,8,true),silver));
      clasp.position.set(A.x,A.y,0);
      scene.add(clasp);
    }catch(e){
      three=false;
      console.warn('3D init failed, falling back to 2D canvas:',e);
    }
  }

  function rem(c){
    if(c.g){
      scene.remove(c.g,c.j);
      c.bt.dispose();c.at.dispose();c.bm.dispose();c.am.dispose();
    }
  }

  function add(src,p){
    if(charms.length>=3)return;
    var c=Object.assign({id:uid++,src:src,sw:src.width,sh:src.height,ac:mk(S,S),bc:mk(S,S),dirty:0,th:0},DEF,p||{});
    build(c);
    if(three)mk3(c);
    charms.push(c);
    sel=c;
    reset();
    ui();
    return c;
  }

  function reset(){
    K=[];
    for(var i=0;i<CLN;i++){
      var y=A.y-(i+1)*CL;
      K.push({x:A.x,y:y,px:A.x,py:y,im:1});
    }
    R={x:A.x,y:K[CLN-1].y-RR,im:.35};
    R.px=R.x+.012;R.py=R.y;
    var n=charms.length;
    var ph=[[],[0],[-0.3,0.3],[-0.5,0,0.5]][n]||[];
    charms.forEach(function(c,i){
      c.jl=0.12;
      c.o={x:RR*Math.sin(ph[i]||0),y:-RR*Math.cos(ph[i]||0)};
      c.h=C_H_MULT*c.size;
      c.T={x:R.x+c.o.x,y:R.y+c.o.y-c.jl,im:1};
      c.B={x:c.T.x,y:c.T.y-c.h,im:1.2};
      c.T.px=c.T.x;c.T.py=c.T.y;
      c.B.px=c.B.x;c.B.py=c.B.y;
      c.z=(i-(n-1)/2)*.08;
    });
    drag=null;
  }

  function W(p){return p===drag?0:p.im;}

  function con(a,b,len,eq){
    var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-6;
    if(!eq&&d<=len)return;
    var wa=W(a),wb=W(b),s=wa+wb;
    if(!s)return;
    var k=(d-len)/d/s;
    a.x+=dx*k*wa;a.y+=dy*k*wa;
    b.x-=dx*k*wb;b.y-=dy*k*wb;
  }

  function step(dt){
    if(!R)return;
    var d=1-P.damp,gs=P.g*dt*dt;
    var ps=K.concat([R]);
    charms.forEach(function(c){c.h=C_H_MULT*c.size;ps.push(c.T,c.B);});
    if(drag===A){
      var mx=(cl(dtx+gox,AX[0],AX[1])-A.x)*.5;
      var my=(cl(dty+goy,AY[0],AY[1])-A.y)*.5;
      var m=Math.hypot(mx,my);
      if(m>.12){mx*=.12/m;my*=.12/m;}
      A.x+=mx;A.y+=my;
    }
    ps.forEach(function(p){
      if(!p)return;
      if(p===drag){
        var tx=dtx,ty=dty;
        var lim=p===R?CLN*CL+RR-.02:3;
        var dx=tx-A.x,dy=ty-A.y;
        var mm=Math.hypot(dx,dy);
        if(mm>lim){tx=A.x+dx/mm*lim;ty=A.y+dy/mm*lim;}
        p.px=p.x;p.py=p.y;
        p.x+=(tx-p.x)*.5;p.y+=(ty-p.y)*.5;
        return;
      }
      var vx=(p.x-p.px)*d,vy=(p.y-p.py)*d;
      var mv=Math.hypot(vx,vy);
      if(mv>.12){vx*=.12/mv;vy*=.12/mv;}
      p.px=p.x;p.py=p.y;
      p.x+=vx;p.y+=vy-gs;
    });
    for(var it=0;it<16;it++){
      for(var i=0;i<CLN;i++)con(i?K[i-1]:A,K[i],CL,true);
      con(K[CLN-1],R,RR,true);
      charms.forEach(function(c){
        var q={x:R.x+c.o.x,y:R.y+c.o.y,im:W(R)};
        var qx=q.x,qy=q.y;
        con(q,c.T,c.jl,false);
        R.x+=q.x-qx;R.y+=q.y-qy;
        con(c.T,c.B,c.h,true);
      });
      if(P.col){
        for(var ii=0;ii<charms.length;ii++){
          for(var jj=ii+1;jj<charms.length;jj++){
            var a=charms[ii].B,b=charms[jj].B;
            var mm2=.348*(charms[ii].size+charms[jj].size);
            var dx2=b.x-a.x,dy2=b.y-a.y;
            var dd=Math.hypot(dx2,dy2)||1e-6;
            if(dd<mm2){
              var wa=W(a),wb=W(b),ss=wa+wb;
              if(ss){
                var kk=(mm2-dd)/dd/ss;
                a.x-=dx2*kk*wa;a.y-=dy2*kk*wa;
                b.x+=dx2*kk*wb;b.y+=dy2*kk*wb;
              }
            }
          }
        }
      }
    }
  }

  function maxCharmSize(){
    var m=0;
    charms.forEach(function(c){if(c.size>m)m=c.size;});
    return m;
  }

  function sync3(){
    if(!R)return;
    ring.position.set(R.x,R.y,0);
    clasp.position.set(A.x,A.y,0);
    for(var i=0;i<CLN;i++){
      var a=i?K[i-1]:A,b=K[i],g=chainG[i];
      g.position.set((a.x+b.x)/2,(a.y+b.y)/2,0);
      g.rotation.z=Math.atan2(b.y-a.y,b.x-a.x)-Math.PI/2;
    }
    charms.forEach(function(c){
      c.g.position.set(c.B.x,c.B.y,c.z);
      c.g.rotation.z=c.th;
      c.g.scale.setScalar(c.size*PLANE_MULT);
      c.in.rotation.y=c.yaw*Math.PI/180;
      var qx=R.x+c.o.x,qy=R.y+c.o.y;
      var dx=c.T.x-qx,dy=c.T.y-qy;
      var d=Math.hypot(dx,dy);
      c.j.position.set((qx+c.T.x)/2,(qy+c.T.y)/2,c.z*.5);
      c.j.rotation.z=Math.atan2(dy,dx)-Math.PI/2;
      c.jm.scale.set(1,(d+.024)/.14,1);
    });
  }

  function sc2(){
    var ms=maxCharmSize();
    var fitFactor=Math.max(1,ms*PLANE_MULT/0.62);
    return Math.min(cv.width/3.2,cv.height/5.2)*10/oc.d/fitFactor;
  }

  function d2(){
    if(!R)return;
    var w=cv.width,h=cv.height,s=sc2();
    var X=function(x){return w/2+x*s;};
    var Y=function(y){return h/2-(y-TY)*s;};
    var g=x2,mc=FIN[HW.fin];
    g.clearRect(0,0,w,h);
    g.lineCap='round';
    g.strokeStyle=mc;g.lineWidth=.052*s;
    g.beginPath();g.ellipse(X(A.x),Y(A.y+.19),.17*s,.19*s,0,0,7);g.stroke();
    g.strokeStyle=mc;g.lineWidth=.028*s;
    for(var i=0;i<CLN;i++){
      var a=i?K[i-1]:A,b=K[i];
      g.save();
      g.translate(X((a.x+b.x)/2),Y((a.y+b.y)/2));
      g.rotate(-(Math.atan2(b.y-a.y,b.x-a.x)-Math.PI/2));
      g.beginPath();g.ellipse(0,0,.045*s,.078*s,0,0,7);g.stroke();
      g.restore();
    }
    g.lineWidth=.05*s;
    g.beginPath();g.arc(X(R.x),Y(R.y),RR*s,0,7);g.stroke();
    g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=.014*s;g.stroke();
    charms.forEach(function(c){
      g.strokeStyle=mc;g.lineWidth=.03*s;
      g.beginPath();g.moveTo(X(R.x+c.o.x),Y(R.y+c.o.y));g.lineTo(X(c.T.x),Y(c.T.y));g.stroke();
      g.save();
      g.translate(X(c.B.x),Y(c.B.y));
      g.rotate(-c.th);
      g.scale(Math.max(.05,Math.abs(Math.cos(c.yaw*Math.PI/180))),1);
      var k=c.size*PLANE_MULT*s;
      g.drawImage(c.bc,-k/2,-k/2,k,k);
      g.drawImage(c.ac,-k/2,-k/2,k,k);
      if(c===sel){
        g.strokeStyle='#4a78c8';g.setLineDash([6,4]);g.lineWidth=2;
        g.strokeRect(-k/2,-k/2,k,k);
      }
      g.restore();
    });
  }

  function updCam(){
    cam.position.set(
      tgt.x+oc.d*Math.sin(oc.ph)*Math.sin(oc.th),
      tgt.y+oc.d*Math.cos(oc.ph),
      tgt.z+oc.d*Math.sin(oc.ph)*Math.cos(oc.th)
    );
    cam.lookAt(tgt);
  }

  function rs(){
    var w=stage.clientWidth,h=stage.clientHeight;
    if(!w||!h)return;
    if(three&&r){r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
    else{cv.width=w;cv.height=h;}
  }

  function toW(e){
    var rc=cv.getBoundingClientRect();
    if(three){
      rayc.setFromCamera({x:(e.clientX-rc.left)/rc.width*2-1,y:-((e.clientY-rc.top)/rc.height)*2+1},cam);
      return rayc.ray.intersectPlane(plane,new THREE.Vector3())||{x:0,y:0};
    }
    var s=sc2();
    return {x:(e.clientX-rc.left-rc.width/2)/s,y:(rc.height/2-(e.clientY-rc.top))/s+TY};
  }

  function pick(w){
    for(var i=charms.length-1;i>=0;i--){
      var c=charms[i];
      if(Math.hypot(w.x-c.B.x,w.y-c.B.y)<.45*c.size*PLANE_MULT)return c;
    }
    if(Math.abs(Math.hypot(w.x-R.x,w.y-R.y)-RR)<.12)return 'ring';
    return Math.hypot((w.x-A.x)/.3,(w.y-(A.y+.19))/.33)<1?'loop':null;
  }

  function inView(){return document.body.classList.contains('view-mode');}
  function setView(on){
    document.body.classList.toggle('view-mode',on);
    if(on)toast('tap anywhere to bring the controls back',2600);
  }

  function bind(){
    cv.oncontextmenu=function(e){e.preventDefault();};
    cv.onpointerdown=function(e){
      if(e.pointerType==='mouse'&&e.button!==0&&e.button!==2)return;
      cv.setPointerCapture(e.pointerId);
      var w=toW(e),h=(e.button===2||e.shiftKey)?null:pick(w);
      lx=e.clientX;ly=e.clientY;tap=null;gox=0;goy=0;
      if(h){
        drag=h==='ring'?R:h==='loop'?A:h.B;
        if(h==='loop'){gox=A.x-w.x;goy=A.y-w.y;}
        if(h!=='ring'&&h!=='loop'){sel=h;ui();}
        dtx=w.x;dty=w.y;
        ptr='d';
        document.body.classList.add('dragging');
      }else{
        ptr=(e.button==2||e.shiftKey)?'pan':'orb';
        if(ptr==='orb'&&e.isPrimary)tap={x:e.clientX,y:e.clientY,t:performance.now()};
      }
    };
    cv.onpointermove=function(e){
      if(!ptr){cv.style.cursor=pick(toW(e))?'grab':'';return;}
      if(ptr==='d'){var w=toW(e);dtx=w.x;dty=w.y;return;}
      var mx=e.clientX-lx,my=e.clientY-ly;
      lx=e.clientX;ly=e.clientY;
      if(!three)return;
      if(ptr==='orb'){
        oc.th-=mx*.008;
        oc.ph=Math.min(2.9,Math.max(.25,oc.ph-my*.008));
      }else{
        var k=oc.d*.0016;
        tgt.x-=mx*k*Math.cos(oc.th);
        tgt.z+=mx*k*Math.sin(oc.th);
        tgt.y+=my*k;
      }
    };
    cv.onpointerup=cv.onpointercancel=function(e){
      if(ptr==='orb'&&tap&&e.type==='pointerup'&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<6&&performance.now()-tap.t<450)setView(!inView());
      tap=null;ptr=null;drag=null;
      document.body.classList.remove('dragging');
    };
    cv.onwheel=function(e){
      e.preventDefault();
      oc.d=Math.min(30,Math.max(4,oc.d*Math.exp(e.deltaY*.001)));
    };
  }

  SPEC.forEach(function(sp){
    var id=sp[0],tp=sp[1],list=sp[2];
    list.forEach(function(item){
      var k=item[0],n=item[1],mn=item[2],mx=item[3],st=item[4];
      var L=document.createElement('label');
      L.className='slider';
      L.innerHTML='<span class="lbl"><span>'+n+'</span><output id="v_'+k+'"></output></span><input type="range" id="r_'+k+'" min="'+mn+'" max="'+mx+'" step="'+st+'">';
      $(id).appendChild(L);
      var inp=L.querySelector('input');
      inp.oninput=function(){
        var v=+inp.value;
        $('v_'+k).textContent=v;
        if(sel){
          sel[k]=v;
          if(tp==='a')sel.dirty=1;
        }
      };
    });
  });

  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('[data-tab]').forEach(function(x){pr(x,x===b);});
      document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id==='t_'+b.dataset.tab);});
    };
  });

  function pickerUI(){
    var el=$('charmPicker');
    if(!el)return;
    if(el.children.length!==3){
      el.innerHTML='';
      for(var i=0;i<3;i++){
        var b=document.createElement('button');
        b.type='button';
        b.textContent=String(i+1);
        b.dataset.charm=i;
        b.onclick=(function(idx){return function(){var k=+idx;if(charms[k]){sel=charms[k];ui();}};})(i);
        el.appendChild(b);
      }
    }
    for(var j=0;j<3;j++){
      var btn=el.children[j];
      btn.disabled=!charms[j];
      btn.setAttribute('aria-pressed',String(charms[j]===sel));
    }
  }

  function slots(){
    var el=$('slots');
    el.innerHTML='';
    charms.forEach(function(c,i){
      var b=document.createElement('button');
      b.type='button';
      b.className='btn slot toggle';
      pr(b,c===sel);
      var t=mk(60,60);
      var x=t.getContext('2d');
      x.drawImage(c.bc,0,0,60,60);
      x.drawImage(c.ac,0,0,60,60);
      b.appendChild(t);
      b.append(tr('charm {n}',{n:i+1}));
      b.onclick=function(){sel=c;ui();};
      el.appendChild(b);
    });
    var n=charms.length,i=charms.indexOf(sel);
    $('del').disabled=!sel;
    $('dup').disabled=!sel||n>=3;
    $('up').disabled=!sel||i<1;
    $('dn').disabled=!sel||i>n-2;
    $('pillN').textContent=n+'/3';
  }

  function ui(){
    SPEC.forEach(function(sp){
      var tp=sp[1],list=sp[2];
      list.forEach(function(item){
        var k=item[0];
        var v=sel?sel[k]:0;
        $('r_'+k).value=v;
        $('v_'+k).textContent=+(+v).toFixed(3);
      });
    });
    pr($('bd'),!!sel&&sel.border);
    $('tint').value=sel?sel.tint:'#bfe0ff';
    slots();
    pickerUI();
    charms.forEach(mat);
  }

  $('bd').onclick=function(){
    if(sel){sel.border=!sel.border;sel.dirty=1;pr($('bd'),sel.border);}
  };
  $('tint').oninput=function(e){
    if(sel){sel.tint=e.target.value;sel.dirty=1;}
  };
  $('cam').onclick=function(){
    oc.th=0;oc.ph=Math.PI/2;oc.d=10.5;
    if(three&&tgt)tgt.set(0,TY,0);
  };
  $('del').onclick=function(){
    if(!sel)return;
    rem(sel);
    charms.splice(charms.indexOf(sel),1);
    sel=charms[charms.length-1]||null;
    reset();ui();
  };
  $('dup').onclick=function(){
    if(!sel)return;
    var p={};
    PK.forEach(function(k){p[k]=sel[k];});
    add(sel.src,p);
  };
  function mv(d){
    var i=charms.indexOf(sel),j=i+d;
    if(i<0||j<0||j>=charms.length)return;
    var tmp=charms[i];charms[i]=charms[j];charms[j]=tmp;
    reset();slots();
  }
  $('up').onclick=function(){mv(-1);};
  $('dn').onclick=function(){mv(1);};
  $('uploadBtn').onclick=function(){$('file').click();};
  $('viewBtn').onclick=function(){setView(true);};
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&inView())setView(false);});
  window.addEventListener('card:lang',function(){slots();});

  $('file').onchange=function(e){
    var f=e.target.files[0];
    e.target.value='';
    if(!f)return;
    if(!/^image\/(png|jpeg|webp)$/.test(f.type)){toast('unsupported file type. use png, jpg or webp.');return;}
    var u=URL.createObjectURL(f),im=new Image();
    im.onload=function(){
      var k=Math.min(1,1024/Math.max(im.width,im.height));
      var c=mk(Math.round(im.width*k),Math.round(im.height*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      if(charms.length<3){
        add(c);
      }else if(sel){
        sel.src=c;sel.sw=c.width;sel.sh=c.height;
        sel.scale=1;sel.rot=0;sel.ox=0;sel.oy=0;
        sel.dirty=1;ui();
      }
    };
    im.onerror=function(){toast('could not read that image.');};
    im.src=u;
  };
  $('png').onclick=function(){
    if(three&&r){sync3();r.render(scene,cam);}
    else d2();
    dl('keyring.png',cv.toDataURL('image/png'));
  };

  if(three)init3();
  if(!three){cv=mk(10,10);x2=cv.getContext('2d');}
  cv.style.display='block';
  stage.insertBefore(cv,stage.firstChild);
  bind();
  if(!three)toast('fallback: 2d canvas mode, not real 3d (no orbit or 3d materials)',6000);
  new ResizeObserver(rs).observe(stage);
  rs();
  ui();
  reset();

  var last=performance.now(),acc=0,errd=false;
  function loop(t){
    requestAnimationFrame(loop);
    try{
      var dt=Math.min((t-last)/1000,.05);
      last=t;
      acc+=dt;
      var n=0;
      while(acc>=1/60&&n++<4){step(1/60);acc-=1/60;}
      var ch=0;
      charms.forEach(function(c){
        if(c.dirty&&t-(c.lt||0)>70){build(c);c.dirty=0;c.lt=t;ch=1;}
      });
      if(ch)slots();
      charms.forEach(function(c){c.th=Math.atan2(c.T.y-c.B.y,c.T.x-c.B.x)-Math.PI/2;});

      if(three){
        var ms=maxCharmSize();
        var targetD=Math.max(10.5,ms*PLANE_MULT*8.5);
        oc.d+=(targetD-oc.d)*.08;
      }

      if(three&&r){updCam();sync3();r.render(scene,cam);}
      else d2();
      if(!stage.classList.contains('ready'))stage.classList.add('ready');
    }catch(err){
      if(!errd){errd=true;console.error(err);toast('a rendering error occurred. check the console for details.',5000);}
    }
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
